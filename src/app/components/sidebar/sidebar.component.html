<nav id="sidebar" [class.footer-open]="uiStateService.footerOpen$ | async">
  <div class="sidebar-content">
    <div class="content-header justify-content-lg-center">
      <div>
        <span class="smini-visible fw-bold tracking-wide fs-lg">
          c<span class="text-primary">b</span>
        </span>
        <a class="link-fx fw-bold tracking-wide mx-auto" [routerLink]="['/']">
          <span class="smini-hidden">
            <img
              src="/assets/img/logo-icon.png"
              alt="logo-icon"
              class="logo-icon"
            />
            <span class="fs-4 text-dual">pod</span
            ><span class="fs-4 text-primary">noms</span>
          </span>
        </a>
      </div>
      <div>
        <button
          type="button"
          class="btn btn-sm btn-alt-danger d-lg-none"
          (click)="closeSidebar()"
          data-toggle="layout"
          data-action="sidebar_close"
        >
          <i class="fa fa-fw fa-times"></i>
        </button>
      </div>
    </div>
    <div class="js-sidebar-scroll simplebar-scrollable-y" data-simplebar="init">
      <div class="simplebar-wrapper">
        <div class="simplebar-height-auto-observer-wrapper">
          <div class="simplebar-height-auto-observer"></div>
        </div>
        <div class="simplebar-mask">
          <div class="simplebar-offset">
            <div
              class="simplebar-content-wrapper"
              tabindex="0"
              role="region"
              aria-label="scrollable content"
              style="height: 100%; overflow: hidden scroll"
            >
              <div class="simplebar-content">
                <div class="content-side px-2 py-2">
                  <div class="smini-hidden text-center mx-auto">
                    <button
                    type="button"
                    (click)="doAddPodcast()"
                    class="btn w-100 btn-alt-primary"
                    data-toggle="click-ripple"
                  >
                    <i class="fas fa fa-plus opacity-50 me-1"></i> New Podcast
                  </button>
                  <div class="my-2">
                    <div class="input-group">
                      <button type="button" class="btn btn-primary">
                        <i class="fa fa-search me-1"></i>
                      </button>
                      <input
                        type="text"
                        class="form-control"
                        #filter
                        placeholder="Search podcasts"
                      />
                    </div>
                  </div>
                  </div>
                </div>
                <div class="content-side content-side-full">
                  <ul class="nav-main nav-podcasts">
                    <li
                    class="nav-main-item"
                    *ngFor="
                      let podcast of podcasts$
                        | async
                        | orderBy: orderByField
                        | filterIf: 'title' : filterValue
                    "
                  >
                    <app-sidebar-podcast-item
                      [podcast]="podcast"
                    ></app-sidebar-podcast-item>
                  </li>
                  </ul>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div
          class="simplebar-placeholder"
          style="width: 250px; height: 912px"
        ></div>
      </div>
      <div
        class="simplebar-track simplebar-horizontal"
        style="visibility: hidden"
      >
        <div
          class="simplebar-scrollbar"
          style="width: 0px; display: none"
        ></div>
      </div>
      <div
        class="simplebar-track simplebar-vertical"
        style="visibility: visible"
      >
        <div
          class="simplebar-scrollbar"
          style="
            height: 882px;
            transform: translate3d(0px, 0px, 0px);
            display: block;
          "
        ></div>
      </div>
    </div>
  </div>
</nav>
