<div class="main-content-boxed">
  <main id="main-container ">
    <div class="row mx-0 justify-content-center bg-image">
      <div class="hero-static content content-full">
        <div class="py-4 px-1 text-center mb-4">
          <div class="py-4 text-center">
            <a class="link-fx fw-bold"
               href="/">
              <img class="font-image me-1"
                   [src]="'/assets/img/logo-icon.png'"
                   alt="logo">
              <span class="fs-4 text-body-color">pod</span><span class="fs-4">noms</span>
            </a>
          </div>
          <div class="row justify-content-center px-1">
            <div class="col-12 col-sm-10 col-md-8 col-lg-6 col-xl-4">
              <div class="block block-themed block-rounded block-fx-shadow">
                <div class="block-header bg-gd-dusk">
                  <h3 class="block-title">Robot Powered Podcasts</h3>
                </div>
                <div class="row g-2 mt-4 px-3">
                  <div class="col-12 col-sm-6 mb-2">
                    <button type="button"
                            class="btn w-100 btn-social btn-facebook d-flex align-items-center justify-content-center"
                            (click)="socialLogin('facebook')">
                      <span class="fa-brands fa-facebook-f me-2"
                            aria-label="Sign in with Facebook">
                      </span>
                      <span class="d-sm-none">Facebook</span>
                      <span class="d-none d-sm-inline">Sign in with Facebook</span>
                    </button>
                  </div>
                  <div class="col-12 col-sm-6 mb-2">
                    <button type="button"
                            class="btn w-100 btn-social btn-google d-flex align-items-center justify-content-center"
                            (click)="socialLogin('google-oauth2')"
                            aria-label="Sign in with Google">
                      <span class="fa-brands fa-google me-2"></span>
                      <span class="d-sm-none">Google</span>
                      <span class="d-none d-sm-inline">Sign in with Google</span>
                    </button>
                  </div>
                </div>
                <div class="alert alert-danger mx-5 mt-3 text-center"
                     *ngIf="errorMessage"
                     role="alert">
                  <p class="mb-0">
                    {{errorMessage}}
                  </p>
                </div>
                <div class="col-md-12 new-user-alert"
                     *ngIf="brandNew">
                  <div class="alert alert-success"
                       role="alert">
                    <strong>Account created!</strong> Please login with your new details
                  </div>
                </div>
                <div class="col-md-12 new-user-alert"
                     *ngIf="justReset">
                  <div class="alert alert-success"
                       role="alert">
                    <strong>Password succesfully reset!</strong> Please login with your new details
                  </div>
                </div>
                <div class="block-content">
                  <form (ngSubmit)="login()"
                        [formGroup]="loginForm">
                    <div class="form-floating mb-4">
                      <input type="text"
                             class="form-control"
                             [ngClass]="{'is-invalid': submitted && f.username.errors}"
                             autocomplete="username"
                             id="username"
                             name="username"
                             formControlName="username"
                             placeholder="Enter your username">
                      <label class="form-label"
                             for="username">Username</label>
                      <div id="val-username-error"
                           *ngIf="submitted && f.username.errors"
                           class="invalid-feedback animated fadeIn">Please enter your username</div>
                    </div>
                    <div class="form-floating mb-4">
                      <input type="password"
                             class="form-control"
                             [ngClass]="{'is-invalid': submitted && f.password.errors}"
                             autocomplete="current-password"
                             id="password"
                             name="password"
                             formControlName="password"
                             placeholder="Enter your password">
                      <label class="form-label"
                             for="password">Password</label>
                      <div id="val-password-error"
                           *ngIf="submitted && f.password.errors"
                           class="invalid-feedback animated fadeIn">Please enter your password</div>
                    </div>

                    <div class="d-flex justify-content-between mb-2">
                      <div>
                        <i *ngIf="isRequesting"
                           class="fas fa fa-2x fa-sun-o fa-spin text-warning"></i>
                      </div>
                      <button type="submit"
                              class="btn btn-lg btn-alt-primary fw-medium">
                        <i class="fa-solid fa-arrow-right-to-bracket"></i> Sign In
                      </button>
                    </div>
                  </form>
                </div>

                <div class="block-content block-content-full bg-body-light text-center">
                  <div class="d-flex flex-column flex-sm-row justify-content-between align-items-center gap-2">
                    <a class="fs-sm fw-medium link-fx text-muted d-inline-block"
                       [routerLink]="['/auth/register']">
                      <i class="fa fa-plus opacity-50 me-1"></i> Create Account
                    </a>
                    <a class="fs-sm fw-medium link-fx text-muted d-inline-block"
                       [routerLink]="['/auth/reset']">
                      <i class="fa-solid fa-lightbulb opacity-50 me-1"></i>
                      Forgot Password
                    </a>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>
